<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <filter id="fiber">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="4" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" values="0 0 0 0 0.36
                                         0 0 0 0 0.27
                                         0 0 0 0 0.21
                                         0 0 0 0.14 0"/>
    </filter>
    <filter id="cloud">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" stitchTiles="stitch" result="c"/>
      <feColorMatrix in="c" values="0 0 0 0 0.42
                                    0 0 0 0 0.33
                                    0 0 0 0 0.22
                                    0 0 0 0.08 0"/>
    </filter>
  </defs>
  <rect width="320" height="320" filter="url(#cloud)"/>
  <rect width="320" height="320" filter="url(#fiber)"/>
</svg>
